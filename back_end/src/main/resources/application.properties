# Server Configuration
server.port=8080
# server.servlet.context-path=/api

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/labdata
#spring.datasource.url=jdbc:postgresql://25.tcp.cpolar.top:13067/labdata

spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# JPA/Hibernate Properties
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# ç¦ç¨å°å­ç¬¦ä¸²è½¬ä¸ºæ°å­ç±»åï¼é¿åé¿æ´åæ°å¼æº¢åº
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.id.new_generator_mappings=true
# æé«SQLæ¥è¯¢æ§è½åç±»åå¤çççµæ´»æ§
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.example.labdata=DEBUG
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

# JWT Configuration
jwt.secret=labdata_secret_key_should_be_very_long_and_secure_in_production
jwt.expiration=864000000

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Allow bean definition overriding
spring.main.allow-bean-definition-overriding=true

# File upload directory
file.upload-dir=./uploads
